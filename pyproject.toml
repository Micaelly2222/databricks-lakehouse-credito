[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit_lakehouse"
version = "1.0.0"
description = "Lakehouse de crédito com dados do Banco Central em Databricks e Delta Lake"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
local = ["pyspark==4.2.0", "delta-spark==4.4.1"]
dev = ["pyspark==4.2.0", "delta-spark==4.4.1", "pytest==9.2.0", "pandas>=2.2,<3"]

[project.scripts]
main = "credit_lakehouse.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
